name: Build, ekstrak ZIP, optimasi gambar, backup
on:
  push:
    branches: [main]
    paths: ['*.zip', 'data/**', 'upload/**', 'assets/img/**', 'assets/files/**', 'shared/**', 'build/**']
  schedule:
    - cron: '7 * * * *'   # tiap jam: menerbitkan artikel terjadwal + backup harian
  workflow_dispatch:
    inputs:
      report:
        description: 'Kirim laporan lengkap ke Telegram dan Google Sheets (yes/no)'
        required: false
        default: 'no'
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Ekstrak semua ZIP di root repo
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Ekstrak $z ke root repo"
            tmp=$(mktemp -d)
            unzip -o -q "$z" -x '__MACOSX/*' '*/.DS_Store' '.git/*' '.github/*' '*/.github/*' -d "$tmp" || true
            src="$tmp"
            nf=$(find "$tmp" -mindepth 1 -maxdepth 1 -type f | wc -l)
            nd=$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | wc -l)
            if [ "$nf" = "0" ] && [ "$nd" = "1" ]; then
              d=$(find "$tmp" -mindepth 1 -maxdepth 1 -type d); b=$(basename "$d")
              case "$b" in assets|data|admin|build|shared|docs|backup|upload|model|artikel|kontak|pricelist|tentang) ;; *) src="$d"; echo "Buang folder pembungkus: $b";; esac
            fi
            cp -a "$src"/. .
            rm -rf "$tmp" "$z"
          done
      - name: Ekstrak file ZIP di folder upload/
        run: |
          shopt -s nullglob
          for z in upload/*.zip; do
            base=$(basename "$z" .zip); dest="assets/img"
            if [[ "$base" == *"--"* ]]; then dest="${base%%--*}"; dest="${dest//__//}"; fi
            case "$dest" in assets*|files*) ;; *) dest="assets/img";; esac
            case "$dest" in *..*) dest="assets/img";; esac
            mkdir -p "$dest"; echo "Ekstrak $z -> $dest"
            unzip -o -q "$z" -x '__MACOSX/*' '*/.DS_Store' '.git/*' '.github/*' -d "$dest" || true
            rm -f "$z"
          done
      - run: npm install --no-audit --no-fund
      - name: Optimasi gambar dan build situs
        run: npm run build
      - name: Backup data
        run: npm run backup
      - name: Commit hasil
        run: |
          git config user.name "xpeng-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Build otomatis" && git push)
      - name: Beritahu Bing lewat IndexNow
        continue-on-error: true
        run: |
          node build/indexnow.js
          git config user.name "xpeng-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/indexnow-sent.json
          git diff --cached --quiet || (git commit -m "IndexNow: catat URL terkirim" && git pull --rebase -q && git push)
      - name: Tarik data Google Search Console
        continue-on-error: true
        env:
          GSC_KEY: ${{ secrets.GSC_KEY }}
        run: |
          node build/gsc.js
          git config user.name "xpeng-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/gsc.json
          git diff --cached --quiet || (git commit -m "Data Search Console" && git pull --rebase -q && git push)
      - name: Laporan artikel ke Telegram dan Google Sheets
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GSC_KEY: ${{ secrets.GSC_KEY }}
          REPORT_ALL: ${{ github.event.inputs.report }}
        run: |
          node build/notify.js
          git config user.name "xpeng-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/notified.json
          git diff --cached --quiet || (git commit -m "Laporan artikel terkirim" && git pull --rebase -q && git push)
      - name: Posting ke Facebook, Instagram, Threads (otomatis dan antrean admin)
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "xpeng-bot"; git config user.email "bot@users.noreply.github.com"
          git pull --rebase -q
          node build/social.js
          git add -A data
          if [ -d social ]; then git add -A social; fi
          git diff --cached --quiet || (git commit -m "Posting sosmed" && git pull --rebase -q && git push)
