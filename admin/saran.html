<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Saran Topik | Admin XPeng</title><meta name="theme-color" content="#0a0b0d">
<style>
:root{--bg:#0a0b0d;--card:#171a21;--line:#292e38;--tx:#f2f3f5;--mu:#9aa1ac;--ac:#2ee6b6;--bad:#ff6b6b;--warn:#ffc857;--blue:#8fb4ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:#0a0b0df2;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px}
header b{font-weight:600;letter-spacing:.14em;font-size:.9rem}header a{color:var(--ac);text-decoration:none;margin-left:auto;min-height:44px;display:inline-flex;align-items:center}
main{max-width:860px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.3rem;margin:6px 0 4px}h2{font-size:1rem;margin:0 0 6px;line-height:1.35}
.muted{color:var(--mu);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#262b34;margin:10px 0 6px}.bar i{display:block;height:100%}.bar .a{background:var(--ac)}.bar .b{background:var(--blue)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{font:inherit;cursor:pointer;border-radius:10px;min-height:44px;padding:10px 14px;border:1px solid var(--line);background:#171a21;color:var(--tx)}
button.on{background:var(--ac);color:#04110d;border-color:var(--ac);font-weight:600}
button.go{background:var(--ac);color:#04110d;border:0;font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;background:#262b34;margin:0 6px 6px 0}
.pill.in{background:#12352c;color:var(--ac)}.pill.lu{background:#1c2a4a;color:var(--blue)}.pill.nw{background:#3a3414;color:#f2d46a}.pill.mi{background:#3a1d1d;color:#ff9a9a}
ul{margin:8px 0 0 18px}li{margin:4px 0;font-size:.88rem}
.rk{color:var(--warn)}
a{color:var(--ac)}a.src{display:inline-block;min-height:32px;padding:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ck{display:flex;gap:10px;align-items:flex-start}.ck input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:#2ee6b6}.ck>div{flex:1;min-width:0}
.sel{position:sticky;bottom:0;z-index:15;background:#0a0b0df5;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 -16px}.sel span{flex:1;min-width:120px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12352c;border:1px solid var(--ac);padding:10px 18px;border-radius:99px;z-index:99;max-width:92%}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head><body>
<header><b>XPENG ADMIN</b><a href="./index.html">← Kembali ke Admin</a></header>
<main>
<h1>Saran Topik Artikel</h1>
<p class="muted" id="meta">Memuat…</p>
<div id="comp"></div>
<div class="fl" id="fl"></div>
<div class="row" style="margin:0 0 4px"><button id="pall">Pilih semua yang tampil</button><button id="pnone">Kosongkan</button></div>
<div id="list"></div>
<div class="sel"><span id="cnt">0 dipilih</span><button class="go" id="bulk">Salin perintah terpilih</button></div>
<p class="muted" style="margin-top:24px">Halaman ini hanya saran. Tidak ada artikel yang ditulis atau diterbitkan otomatis. Berita hanya pemicu ide: artikel harus ditulis ulang orisinal dari data resmi, dan harga hanya dari pricelist resmi.</p>
</main>
<script>
(function () {
  var F = 'semua', DATA = null, PICK = {}, $ = function (s) { return document.querySelector(s); };
  var FILTERS = [['semua', 'Semua'], ['inti', 'Niche inti'], ['luas', 'Niche luas'], ['berita', 'Berita'], ['tren', 'Tren'], ['pencarian', 'Pertanyaan'], ['baru', 'Baru minggu ini']];
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function toast(m) { var t = el('div', 'toast', m); document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200); }
  function copy(text) {
    function fb() { var a = el('textarea'); a.value = text; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast('Perintah disalin'); } catch (e) { toast('Gagal menyalin, salin manual'); } a.remove(); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('Perintah disalin'); }, fb); else fb();
  }
  function cmd(x) {
    return 'Tulis artikel orisinal 800+ kata tentang: ' + x.topik + '.\nSudut: ' + (x.saranSudut || '') + '\nSyarat: skor SEO 100, ada Jawaban singkat + FAQ, link internal dan sumber, harga hanya dari pricelist resmi, tulis ulang dengan kata sendiri (jangan salin berita).' + (x.miripArtikel ? '\nCatatan: mirip artikel /artikel/' + x.miripArtikel + '/ , sebaiknya perbarui artikel itu.' : '');
  }
  function bulkCmd(arr) {
    return 'Tolong buatkan ' + arr.length + ' artikel orisinal untuk website xpengwins.com, lalu langsung simpan ke admin (data/articles.json di repo xpengwins/xpeng-site) dengan status "draft". Jangan terbitkan dan jangan beri tanggal terbit.\n\nSyarat tiap artikel: 800+ kata, ditulis ulang dengan kata sendiri (jangan salin berita), riset sumber resmi dulu, ada "Jawaban singkat" di awal dan FAQ, link internal dan sumber, skor SEO 100, harga hanya dari pricelist resmi. Isi semua kolom: title, slug, keyword, description, image, imageAlt, date, status="draft", category, body. Tambahkan saja ke artikel yang ada, jangan ubah artikel lama. Setelah selesai, laporkan judul dan skor SEO tiap artikel.\n\nDaftar topik:\n' +
      arr.map(function (x, i) { return (i + 1) + '. ' + x.topik + '\n   Sudut: ' + (x.saranSudut || '-') + (x.miripArtikel ? '\n   Catatan: mirip /artikel/' + x.miripArtikel + '/ , sebaiknya perbarui artikel itu, bukan buat baru.' : '') + (x.risiko && x.risiko.length ? '\n   Hati-hati: ' + x.risiko.join('; ') : ''); }).join('\n');
  }
  function key(x) { return x.topik; }
  function count() { var n = Object.keys(PICK).length; $('#cnt').textContent = n + ' dipilih'; $('#bulk').disabled = !n; $('#bulk').style.opacity = n ? 1 : .5; }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
  function render() {
    var L = $('#list'); L.textContent = '';
    var items = (DATA.ide || []).filter(function (x) {
      return F === 'semua' || (F === 'baru' ? x.baru : (x.kelompok === F || x.jenis === F));
    });
    if (!items.length) { L.appendChild(el('p', 'muted', 'Tidak ada saran untuk filter ini.')); return; }
    items.forEach(function (x) {
      var c = el('div', 'card'), w = el('div', 'ck'), cb = el('input'), body = el('div'); cb.type = 'checkbox'; cb.checked = !!PICK[key(x)]; cb.setAttribute('aria-label', 'Pilih ' + x.topik);
      cb.onchange = function () { if (cb.checked) PICK[key(x)] = x; else delete PICK[key(x)]; count(); };
      w.appendChild(cb); w.appendChild(body); c.appendChild(w); var host = c; c = body;
      c.appendChild(el('h2', '', x.topik));
      var p = el('div');
      p.appendChild(el('span', 'pill ' + (x.kelompok === 'inti' ? 'in' : 'lu'), x.kelompok === 'inti' ? 'Niche inti' : 'Niche luas'));
      p.appendChild(el('span', 'pill', x.jenis));
      p.appendChild(el('span', 'pill', 'skor ' + x.skor));
      if (x.baru) p.appendChild(el('span', 'pill nw', 'baru'));
      if (x.miripArtikel) p.appendChild(el('span', 'pill mi', 'mirip artikel lama'));
      c.appendChild(p);
      c.appendChild(el('p', 'muted', x.alasan));
      c.appendChild(el('p', '', x.saranSudut || '')).style.marginTop = '8px';
      if (x.risiko && x.risiko.length) { var u = el('ul', 'rk'); x.risiko.forEach(function (r) { u.appendChild(el('li', '', r)); }); c.appendChild(u); }
      var srcs = (x.sumber || []).filter(function (s) { return safeUrl(s.link); });
      if (srcs.length) {
        c.appendChild(el('p', 'muted', 'Sumber ide (hanya untuk dibaca, jangan disalin):')).style.marginTop = '10px';
        srcs.forEach(function (s) { var a = el('a', 'src', (s.media || 'sumber') + ' · ' + (s.tanggal || '') + ' · ' + (s.judul || '').slice(0, 70)); a.href = safeUrl(s.link); a.target = '_blank'; a.rel = 'noopener nofollow'; c.appendChild(a); c.appendChild(el('br')); });
      }
      var r = el('div', 'row'), b = el('button', 'go', 'Salin perintah ke Claude'); b.onclick = function () { copy(cmd(x)); }; r.appendChild(b); c.appendChild(r);
      L.appendChild(host);
    });
  }
  function filters() {
    var f = $('#fl'); f.textContent = '';
    FILTERS.forEach(function (x) { var b = el('button', F === x[0] ? 'on' : '', x[1]); b.onclick = function () { F = x[0]; filters(); render(); }; f.appendChild(b); });
  }
  $('#pall').onclick = function () { document.querySelectorAll('#list .ck input').forEach(function (i) { if (!i.checked) { i.checked = true; i.onchange(); } }); };
  $('#pnone').onclick = function () { PICK = {}; document.querySelectorAll('#list .ck input').forEach(function (i) { i.checked = false; }); count(); };
  $('#bulk').onclick = function () { var a = Object.keys(PICK).map(function (k) { return PICK[k]; }); if (!a.length) return toast('Centang topik dulu'); copy(bulkCmd(a)); };
  count();
  fetch('../data/riset-tren.json?t=' + Date.now()).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
    DATA = d;
    var dt = d.generated ? new Date(d.generated).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' WIB' : '-';
    $('#meta').textContent = 'Diperbarui otomatis tiap Senin. Terakhir: ' + dt + '. Sumber: ' + (d.sumber ? d.sumber.berita + ' berita, ' + d.sumber.tren + ' tren, ' + d.sumber.pencarian + ' pertanyaan' : '-') + '.';
    var k = d.komposisi || { inti: 0, luas: 0 }, tot = (k.inti + k.luas) || 1, c = $('#comp'); c.className = 'card';
    c.appendChild(el('b', '', 'Komposisi saran (target ' + (k.target || '70:30') + ')'));
    var bar = el('div', 'bar'), a = el('i', 'a'), b = el('i', 'b'); a.style.width = (k.inti / tot * 100) + '%'; b.style.width = (k.luas / tot * 100) + '%'; bar.appendChild(a); bar.appendChild(b); c.appendChild(bar);
    c.appendChild(el('span', 'muted', 'Niche inti ' + k.inti + ' (XPeng, mobil listrik) · Niche luas ' + k.luas + ' (otomotif umum)'));
    filters(); render();
  }).catch(function () {
    $('#meta').textContent = 'Belum ada data saran.';
    var l = $('#list'), c = el('div', 'card'); c.appendChild(el('p', '', 'Data saran belum ada. Buka GitHub, tab Actions, pilih "Agent pantau", lalu Run workflow dengan "riset_sekarang" = yes. Setelah selesai, buka ulang halaman ini.')); l.appendChild(c);
  });
})();
</script></body></html>
