<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Admin XPeng</title><meta name="theme-color" content="#0a0b0d"><link rel="icon" href="../assets/img/favicon.svg">
<style>
:root{--bg:#0a0b0d;--bg2:#111318;--card:#171a21;--line:#292e38;--tx:#f2f3f5;--mu:#9aa1ac;--ac:#2ee6b6;--bad:#ff6b6b;--warn:#ffc857;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;padding-bottom:84px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:#0a0b0df2;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}header b{font-weight:600;letter-spacing:.14em}header img{height:18px}
main{max-width:900px;margin:0 auto;padding:16px}h2{font-size:1.25rem;margin:6px 0 14px}h3{font-size:1rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 auto}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:grid;gap:5px;font-size:.82rem;color:var(--mu);margin-bottom:12px}input,select,textarea{background:#0d0f13;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;width:100%;min-height:44px}textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:.88rem}
button,.btn{background:var(--ac);color:#04110d;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}button.s{background:#262b34;color:var(--tx)}button.d{background:#3a1d1d;color:#ff9a9a}button.sm{min-height:36px;padding:6px 12px;font-size:.85rem}button:disabled{opacity:.5}
.muted{color:var(--mu);font-size:.85rem}.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;background:#262b34}.pill.ok{background:#12352c;color:var(--ac)}.pill.bad{background:#3a1d1d;color:#ff9a9a}.pill.warn{background:#3a3016;color:var(--warn)}
.score{font-size:2.6rem;font-weight:300;line-height:1}.score.A{color:var(--ac)}.score.B{color:#8be07a}.score.C{color:var(--warn)}.score.D{color:var(--bad)}
.chk{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem}.chk i{font-style:normal;width:18px}.chk .t{color:var(--mu);font-size:.78rem}
table{width:100%;border-collapse:collapse;font-size:.86rem}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:500}.tw{overflow-x:auto}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:#0d0f13;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}nav.bot button{flex:1;background:none;color:var(--mu);flex-direction:column;font-size:.68rem;font-weight:500;min-height:48px;padding:4px;gap:2px}nav.bot button.on{color:var(--ac)}nav.bot span{font-size:1.2rem}
.menu{display:none;position:fixed;inset:auto 0 62px 0;background:#0d0f13;border-top:1px solid var(--line);padding:12px;z-index:31;grid-template-columns:repeat(3,1fr);gap:8px}.menu.open{display:grid}.menu button{background:#171a21;color:var(--tx);flex-direction:column;min-height:64px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.thumbs figure{background:#0d0f13;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.68rem;color:var(--mu)}.thumbs img{width:100%;height:72px;object-fit:cover}.thumbs figcaption{padding:4px 6px;word-break:break-all}
.pv{height:64px;border-radius:8px;margin-top:6px;border:1px solid var(--line);object-fit:cover}.pvs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.pvs img{height:56px;border-radius:6px;border:1px solid var(--line)}.crow{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#0d0f13}.crow input[type=color]{height:44px;padding:2px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#12352c;border:1px solid var(--ac);color:#fff;padding:10px 18px;border-radius:99px;z-index:99;max-width:92%}.toast.bad{background:#3a1d1d;border-color:var(--bad)}
.prev{background:#fff;color:#111;border-radius:12px;padding:16px;max-height:420px;overflow:auto}.prev h2{font-size:1.2rem;margin:14px 0 6px}.prev p,.prev li{margin:6px 0}.prev table{border:1px solid #ccc}.prev td,.prev th{border:1px solid #ccc}
.bar{height:8px;background:#262b34;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
#login{max-width:480px;margin:40px auto;padding:16px}
</style></head><body>
<div id="app"></div>
<script src="../shared/md.js"></script><script src="../shared/seo.js"></script>
<script src="app.js"></script>
</body></html>
